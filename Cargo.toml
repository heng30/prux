[package]
name = "prux"
version = "1.4.0"
edition = "2024"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/heng30/prux"
repository = "https://github.com/heng30/prux"
keywords = ["cli", "tui", "llm", "agent", "terminal"]
exclude = ["screenshot/", "tests/", "examples/", "migrations/"]
description = "A minimal terminal coding agent: TUI, built-in coding tools, and an extension system"
default-run = "prux"
categories = [
  "development-tools",
  "command-line-interface",
  "artificial-intelligence",
]

[profile.dev]
lto = false
debug = false
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
strip = true
debug = false
# panic = "abort"
opt-level = "s"
codegen-units = 1
incremental = true

[features]
default = ["tui"]
tui = []
gui = ["dep:gpui", "dep:gpui_platform", "dep:native-dialog"]
test-support = []

[[bin]]
name = "prux"
path = "src/bin/prux.rs"

[[bin]]
name = "prux-gui"
path = "src/bin/prux_gui.rs"
required-features = ["gui"]

[dependencies]
url = { version = "2.5", default-features = false }
lru = { version = "0.19", default-features = false }
http = { version = "1.0", default-features = false }
nusb = { version = "0.2", default-features = false }
dirs = { version = "7.0", default-features = false }
native-dialog = { version = "0.9", optional = true }
sha2 = { version = "0.11", default-features = false }
bytes = { version = "1.12", default-features = false }
ignore = { version = "0.4", default-features = false }
linkme = { version = "0.3", default-features = false }
tempfile = { version = "3.27", default-features = false }
stacksafe = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
quick-xml = { version = "0.42", default-features = false }
russh-sftp = { version = "3.0", default-features = false }
tokio-serial = { version = "5", default-features = false }
sse-stream = { version = "0.2", default-features = false }
webbrowser = { version = "1.0", default-features = false }
tokio-util = { version = "0.7", default-features = false }
html2text = { version = "0.17", default-features = false }
async-trait = { version = "0.1", default-features = false }
jsonschema = { version = "0.60", default-features = false }
pdf-extract = { version = "0.12", default-features = false }
tiktoken-rs = { version = "0.12", default-features = false }
futures-util = { version = "0.3", default-features = false }
strum_macros = { version = "0.28", default-features = false }
unicode-width = { version = "0.2", default-features = false }
http-body-util = { version = "0.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = { version = "1.13", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }

strum = { version = "0.28", default-features = false, features = ["std"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
similar = { version = "3.1", default-features = false, features = ["text"] }
getrandom = { version = "0.4", default-features = false, features = ["std"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
calamine = { version = "0.38", default-features = false, features = ["dates"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

clap = { version = "4.5", default-features = false, features = [
  "std",
  "help",
  "usage",
  "derive",
  "suggestions",
  "error-context",
] }
rmcp = { version = "3.1", default-features = false, features = [
  "client",
  "auth",
  "transport-child-process",
  "reqwest-tls-no-provider",
  "transport-streamable-http-client-reqwest",
] }
russh = { version = "0.65", default-features = false, features = [
  "rsa",
  "flate2",
  "aws-lc-rs",
] }
regex = { version = "1.11", default-features = false, features = [
  "unicode-perl",
  "unicode-case",
] }
hyper = { version = "1.11", default-features = false, features = [
  "http1",
  "server",
] }
tokio = { version = "1.53", default-features = false, features = [
  "net",
  "sync",
  "time",
  "macros",
  "io-std",
  "io-util",
  "process",
  "rt-multi-thread",
] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "bmp",
  "gif",
  "webp",
  "jpeg",
] }
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
] }
syntect = { version = "5.3", default-features = false, features = [
  "yaml-load",
  "regex-fancy",
  "default-syntaxes",
] }
arboard = { version = "3.6", default-features = false, features = [
  "image-data",
  "wayland-data-control",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "socks",
  "stream",
  "rustls",
] }
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
] }
rquickjs = { version = "0.14", default-features = false, features = [
  "std",
  "macro",
  "futures",
  "classes",
  "parallel",
  "rust-alloc",
  "properties",
  "array-buffer",
] }
probe-rs = { version = "0.32", default-features = false, features = [
  "builtin-targets",
  "builtin-formats",
] }
serde_json = { version = "1.0", default-features = false, features = [
  "preserve_order",
] }
crossterm = { version = "0.29", default-features = false, features = [
  "event-stream",
] }
ascii-dag = { version = "0.11", default-features = false, features = [
  "std",
  "ports",
  "generic",
  "layout-vertical",
  "layout-horizontal",
] }
ratatui-image = { version = "11.1", default-features = false, features = [
  "crossterm",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "rustls",
] }

# gpui 不走 crates.io 的 0.2.x：那一版的 Windows 后端把 IME 认领的按键（VK_PROCESSKEY）
# 解成真实键再投递给应用，只靠「应用自报组字状态」兜着，中文输入法组字时按退格会把
# 输入框里的字删掉。上游后来改成「IME 认领的按键不投递给应用」+ 每帧显式关联 IME 上下文。
# 这里钉死一个上游 commit（= 发布过的 gpui 0.3.11 快照），避免浮动的 API/行为漂移。
gpui = { git = "https://github.com/zed-industries/zed", rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038", optional = true, features = [
  "windows-manifest", # Windows 资源清单（DPI 感知 / 系统版本声明）：gpui 的 build.rs 靠它内嵌 gpui.rc，缺了 Windows 上窗口缩放与圆角会退化成 XP 行为
] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f816e1f9263e3a8ef63c4baaa02e1441ce1c6038", optional = true, features = [
  "x11",
  "wayland",  # Linux 渲染后端；x11 / wayland 二者都要留（用户环境都可能有）
  "font-kit", # 文本系统：缺了会退化成 NoopTextSystem，界面无字
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = [
  "fs",
  "user",
  "poll",
  "signal",
  "process",
] }

[target.'cfg(target_os = "linux")'.dependencies]
xcap = { version = "0.9", default-features = false }
rppal = { version = "0.22", default-features = false }
enigo = { version = "0.6", default-features = false, features = ["wayland"] }
zbus = { version = "6.0", default-features = false, features = [
  "proxy",
  "tokio",
] }

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9", default-features = false }
enigo = { version = "0.6", default-features = false }
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
xcap = { version = "0.9", default-features = false }
enigo = { version = "0.6", default-features = false }
core-graphics = { version = "0.25", default-features = false, features = [
  "highsierra",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = { version = "3.0", default-features = false }

[dev-dependencies]
log = "0.4"
tower = "0.5"
anyhow = "1.0"
env_logger = "0.11"
tokio-stream = "0.1"
prux = { path = ".", features = ["test-support"] }
rmcp = { version = "3.1", default-features = false, features = [
  "tower",
  "server",
  "server-side-http",
  "transport-streamable-http-server",
] }
